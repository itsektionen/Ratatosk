version: "0.5"

processes:
  backend:
    command: go run . serve
    environment:
      - ADDR=127.0.0.1:8000 # keep in sync with web/vite.config.ts
      - SITES_DIR=.sites
      # Browsers resolve *.localhost, so we can test like this without DNS setup
      - BASE_DOMAIN=localhost
    # Restart on Go changes
    watch:
      debounce: 500ms
      paths:
        - path: .
          include: ["*.go", go.mod, go.sum]
          exclude: [web, .sites]
  web:
    command: npm run dev
    working_dir: ./web
