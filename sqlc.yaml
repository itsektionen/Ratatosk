version: "2"
sql:
  - engine: sqlite
    schema: internal/db/migrations
    queries: internal/auth/queries.sql
    gen:
      go:
        package: authdb
        out: internal/auth/authdb
  - engine: sqlite
    schema: internal/db/migrations
    queries: internal/sites/queries.sql
    gen:
      go:
        package: sitesdb
        out: internal/sites/sitesdb
